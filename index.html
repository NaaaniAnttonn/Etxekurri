<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Etxekurri - Arrosako Gazteriak</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#09090e;--surface:#111116;--s2:#17171e;--s3:#1e1e27;
  --border:#252530;--b2:#323240;
  --text:#ededf5;--muted:#606080;--m2:#8888aa;
  --accent:#5b8af0;--ag:rgba(91,138,240,.2);
  --green:#22c55e;--amber:#f59e0b;--red:#ef4444;
  --gold:#eab308;
  --nav-h:60px;--safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
#map{position:fixed;inset:0;z-index:1;top:52px;bottom:calc(var(--nav-h) + var(--safe-b));}
#map.add-mode{cursor:crosshair}
#map.move-mode{cursor:move}

/* ── TOP BAR ── */
.topbar{
  position:fixed;top:0;left:0;right:0;height:52px;z-index:600;
  background:rgba(9,9,14,.88);border-bottom:1px solid var(--border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;padding:0 12px;gap:8px;
}
.tb-brand{font-size:13px;font-weight:600;flex:1;letter-spacing:-.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tb-brand span{color:var(--muted);font-weight:400;font-size:11px}
.tb-pill{
  display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:14px;
  background:var(--s2);border:1px solid var(--border);
  font-size:11px;font-weight:500;color:var(--m2);white-space:nowrap;cursor:pointer;
}
.tb-pill.admin{border-color:var(--gold);color:var(--gold)}
.tb-pill.member{border-color:var(--green);color:var(--green)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s;}
.sync-dot.ok{background:var(--green)}
.sync-dot.err{background:var(--red)}
.sync-dot.loading{background:var(--amber);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── BOTTOM NAV ── */
.botnav{
  position:fixed;bottom:0;left:0;right:0;z-index:600;
  height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
  background:rgba(9,9,14,.94);border-top:1px solid var(--border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;align-items:stretch;
}
.bnitem{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;background:transparent;border:none;color:var(--muted);
  font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;transition:color .15s;padding:0;
}
.bnitem.on{color:var(--accent)}
.bnitem svg{width:22px;height:22px;stroke-width:1.8}
.bnitem-add{flex:1.4}
.bnitem-add .add-circle{
  width:46px;height:46px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 4px var(--ag),0 4px 20px rgba(91,138,240,.5);
  transition:all .15s;margin-bottom:1px;
}
.bnitem-add.on .add-circle{background:var(--red);box-shadow:0 0 0 4px rgba(239,68,68,.2),0 4px 20px rgba(239,68,68,.4)}
.bnitem-add .add-circle svg{width:24px;height:24px;stroke:#fff;stroke-width:2.2}

/* ── SHEETS ── */
.sheet{
  position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b));
  z-index:500;background:var(--surface);border-radius:16px 16px 0 0;
  border-top:1px solid var(--b2);box-shadow:0 -8px 40px rgba(0,0,0,.6);
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,0,.2,1);
  display:flex;flex-direction:column;max-height:82vh;overflow:hidden;
}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--b2);margin:10px auto 0;flex-shrink:0;}
.sheet-title{
  padding:12px 18px 10px;font-size:15px;font-weight:600;
  border-bottom:1px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;gap:10px;
}
.sheet-title span{flex:1}
.sheet-close{
  width:28px;height:28px;border-radius:50%;border:1px solid var(--border);
  background:var(--s2);color:var(--muted);font-size:14px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.sheet-body{flex:1;overflow-y:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px}
.sheet-body::-webkit-scrollbar{display:none}

/* ── FORMS ── */
.sh-sec{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sh-name-input,.minput,.grp-sel,.note-ta,.amount-input{
  width:100%;padding:11px 14px;border-radius:12px;font-size:14px;
  background:var(--s2);border:1px solid var(--border);color:var(--text);
  font-family:'DM Sans',sans-serif;
}
.note-ta{resize:none;min-height:60px}
.amount-input{padding-left:28px}
.amount-wrap{position:relative}
.amount-wrap::before{content:'€';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.sh-name-input:focus,.minput:focus,.grp-sel:focus,.note-ta:focus,.amount-input:focus{outline:none;border-color:var(--accent)}
.grp-sel{-webkit-appearance:none;appearance:none}

.st-row{display:flex;gap:8px}
.st-btn{
  flex:1;padding:11px 6px;border-radius:12px;font-size:12px;font-weight:600;
  border:1.5px solid;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;text-align:center;
}
.sh-actions{display:flex;gap:8px}
.sh-btn{
  flex:1;padding:13px;border-radius:12px;font-size:14px;font-weight:600;
  border:1px solid var(--border);background:var(--s2);color:var(--text);
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;
}
.sh-btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.sh-btn-del{border-color:var(--red);color:var(--red);background:transparent}
.sh-btn-gold{border-color:var(--gold);color:var(--gold);background:transparent}

/* ── LIST ── */
.list-search{
  width:100%;padding:11px 14px;border-radius:12px;font-size:14px;
  background:var(--s2);border:1px solid var(--border);color:var(--text);
  font-family:'DM Sans',sans-serif;
}
.list-search:focus{outline:none;border-color:var(--accent)}
.list-search::placeholder{color:var(--muted)}
.hlist{display:flex;flex-direction:column;gap:4px}
.hi{padding:12px 14px;border-radius:12px;background:var(--s2);border:1px solid transparent;cursor:pointer;}
.hi.sel{border-color:var(--accent);background:rgba(91,138,240,.07)}
.hi-row{display:flex;align-items:center;gap:9px}
.hi-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hi-label{font-size:14px;font-weight:500;flex:1}
.hi-badge{font-size:11px;padding:2px 8px;border-radius:8px;font-weight:500}
.hi-sub{font-size:11.5px;color:var(--muted);margin-top:3px;padding-left:17px}
.hi-amount{font-size:11px;color:var(--green);font-weight:600}

/* ── GROUPS ── */
.gcard{border-radius:12px;border:1px solid var(--border);background:var(--s2);overflow:hidden;margin-bottom:6px}
.gheader{padding:12px 14px;display:flex;align-items:center;gap:10px}
.gcol{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.gname{font-size:14px;font-weight:600;flex:1}
.gcnt{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--s3);color:var(--m2)}
.gbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.gbar-wrap{margin:0 14px 8px;height:3px;background:var(--s3);border-radius:2px;overflow:hidden}
.gbar{height:100%;border-radius:2px;transition:width .4s}
.gsub{padding:0 14px 8px;font-size:11px;color:var(--muted)}
.gmems{padding:0 10px 10px;display:flex;flex-direction:column;gap:3px}
.gmem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;background:var(--s3);font-size:13px;cursor:pointer;}
.gmdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.gmname{flex:1}
.gmrm{width:26px;height:26px;border-radius:7px;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.gempty{padding:8px 14px 12px;font-size:12px;color:var(--muted);font-style:italic}
.new-g-btn{padding:14px;border-radius:12px;width:100%;background:transparent;border:1.5px dashed var(--b2);color:var(--muted);font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;}

/* ── COLOR PICKER ── */
.mlabel{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.cpicker{display:flex;gap:10px;flex-wrap:wrap;padding:4px 0}
.cp{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .15s}
.cp.on{border-color:#fff;transform:scale(1.15)}

/* ── ADMIN PANEL ── */
.admin-section{background:rgba(234,179,8,.06);border:1px solid rgba(234,179,8,.2);border-radius:14px;padding:14px}
.admin-section-title{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.edition-card{
  padding:12px 14px;border-radius:12px;background:var(--s2);
  border:1px solid var(--border);cursor:pointer;margin-bottom:6px;
  display:flex;align-items:center;gap:10px;
}
.edition-card.active{border-color:var(--accent);background:rgba(91,138,240,.07)}
.edition-label{font-size:14px;font-weight:500;flex:1}
.edition-badge{font-size:11px;padding:2px 8px;border-radius:8px}
.edition-badge.active{background:rgba(91,138,240,.2);color:var(--accent)}
.edition-badge.inactive{background:var(--s3);color:var(--muted)}
.stat-row{display:flex;gap:8px;margin-bottom:10px}
.stat-card{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.stat-num{font-size:22px;font-weight:600;color:var(--text)}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:2px}
.stat-card.green .stat-num{color:var(--green)}
.stat-card.gold .stat-num{color:var(--gold)}

/* ── FILTER BAR ── */
.filter-bar{
  position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 8px);left:12px;right:12px;
  z-index:400;display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none;
}
.filter-bar::-webkit-scrollbar{display:none}
.fpill{
  flex-shrink:0;display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:14px;
  background:rgba(9,9,14,.85);border:1px solid var(--border);
  font-size:11.5px;font-weight:500;color:var(--m2);cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;
}
.fpill.on{border-color:var(--accent);background:rgba(9,9,14,.95);color:var(--accent)}
.fdot{width:6px;height:6px;border-radius:50%}

/* ── HINTS ── */
.add-hint{
  position:fixed;top:64px;left:50%;transform:translateX(-50%);
  background:#8b5cf6;color:#fff;padding:8px 20px;border-radius:20px;
  font-size:13px;font-weight:600;z-index:700;box-shadow:0 4px 20px rgba(139,92,246,.5);
  pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;
}
.add-hint.show{opacity:1}

/* Add mode panel — affiché en bas au-dessus de la nav */
.add-panel{
  position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);
  left:16px;right:16px;z-index:700;
  background:rgba(17,17,22,.96);border:1px solid var(--accent);
  border-radius:16px;padding:14px 16px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 4px 24px rgba(91,138,240,.3);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transform:translateY(16px);opacity:0;pointer-events:none;
  transition:all .25s cubic-bezier(.32,0,.2,1);
}
.add-panel.show{transform:translateY(0);opacity:1;pointer-events:auto}
.add-panel-text{flex:1;font-size:13px;font-weight:500;color:var(--text);line-height:1.4}


/* ── BOUTON GPS FAB ── */


/* ── TOAST ── */
.toast{
  position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:var(--s3);border:1px solid var(--b2);color:var(--text);
  padding:8px 18px;border-radius:14px;font-size:13px;font-weight:500;
  z-index:900;transition:transform .25s cubic-bezier(.32,0,.2,1);
  white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.5);
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── LOGIN OVERLAY ── */
.login-overlay{
  position:fixed;inset:0;z-index:2000;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:24px;
}

.login-box{
  width:100%;max-width:340px;background:var(--surface);
  border:1px solid var(--b2);border-radius:20px;padding:28px 24px;
  position:relative;z-index:2001;
}
.login-title{font-size:18px;font-weight:600;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:24px}
.login-tabs{display:flex;gap:6px;margin-bottom:18px}
.login-tab{
  flex:1;padding:9px;border-radius:10px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;
  font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;
}
.login-tab.on{background:var(--s2);border-color:var(--b2);color:var(--text)}
.login-tab.admin.on{border-color:var(--gold);color:var(--gold)}
.login-tab.member.on{border-color:var(--green);color:var(--green)}
.login-input{
  width:100%;padding:13px 14px;border-radius:12px;font-size:15px;
  background:var(--s2);border:1px solid var(--border);color:var(--text);
  font-family:'DM Sans',sans-serif;margin-bottom:12px;
}
.login-input:focus{outline:none;border-color:var(--accent)}
.login-btn{
  width:100%;padding:13px;border-radius:12px;font-size:15px;font-weight:600;
  border:none;background:var(--accent);color:#fff;
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:opacity .15s;
}
.login-btn:active{opacity:.8}
.login-err{font-size:12px;color:var(--red);text-align:center;min-height:18px;margin-top:8px}

/* ── MISC ── */
.empty-st{padding:32px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.empty-st .ei{font-size:32px;display:block;margin-bottom:8px}
.leaflet-control-zoom{margin:10px 10px 0 0!important}
.leaflet-control-zoom a{width:36px!important;height:36px!important;line-height:36px!important;font-size:18px!important;background:rgba(9,9,14,.85)!important;color:var(--text)!important;border-color:var(--border)!important;}
.leaflet-control-attribution{font-size:8px!important;background:rgba(9,9,14,.6)!important;color:var(--muted)!important}
.leaflet-tooltip{background:rgba(17,17,22,.96)!important;border:1px solid var(--b2)!important;color:var(--text)!important;font-family:'DM Sans',sans-serif!important;font-size:12px!important;font-weight:500!important;border-radius:8px!important;padding:5px 12px!important;}
.leaflet-tooltip-top::before{border-top-color:var(--b2)!important}
</style>
<script>
// Déclaré dans <head> pour être dispo dès le rendu du HTML
var loginTab = 'member';
function switchTab(t){
  loginTab=t;
  var tm=document.getElementById('tab-member');
  var ta=document.getElementById('tab-admin');
  if(tm) tm.className='login-tab member'+(t==='member'?' on':'');
  if(ta) ta.className='login-tab admin'+(t==='admin'?' on':'');
  document.getElementById('loginPwd').value='';
  document.getElementById('loginErr').textContent='';
}
var pwdVisible=false;
function togglePwdVis(){
  pwdVisible=!pwdVisible;
  var inp=document.getElementById('loginPwd');
  inp.type=pwdVisible?'text':'password';
  document.getElementById('togglePwd').textContent=pwdVisible?'🙈':'👁';
}
function doLoginKey(e){if(e.key==='Enter')doLogin();}
</script>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-title">Etxekurri - Arrosako Gazteriak</div>
    <div class="login-sub">Arrosako Gazteriak</div>
    <div class="login-tabs">
      <button class="login-tab member on" id="tab-member" onclick="switchTab('member')">Membre</button>
      <button class="login-tab admin" id="tab-admin" onclick="switchTab('admin')">Admin ⚙️</button>
    </div>
    <div style="position:relative">
      <input class="login-input" type="password" id="loginPwd" placeholder="Mot de passe…" onkeydown="doLoginKey(event)" autocomplete="current-password"/>
      <button type="button" id="togglePwd" onclick="togglePwdVis()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px;line-height:1">👁</button>
    </div>
    <button class="login-btn" onclick="doLogin()">Accéder</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="tb-brand" id="tbBrand">Etxekurri - Arrosako Gazteriak</div>
  <div id="tbPill" class="tb-pill" onclick="openSheet('admin')" style="display:none">
    <div class="sync-dot loading" id="syncDot"></div>
    <span id="tbCount">…</span>
  </div>
  <div id="roleBadge" class="tb-pill" style="display:none" onclick="logout()">
    <span id="roleLabel">–</span>
  </div>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- GPS FAB — haut droite sur la carte -->
<button id="gps-fab" onclick="toggleGps()" title="Activer le suivi GPS" style="
  position:fixed;top:62px;right:10px;
  z-index:450;
  width:44px;height:44px;border-radius:50%;
  background:rgba(17,17,22,.88);
  border:1px solid rgba(50,50,64,.9);
  display:none;
  align-items:center;justify-content:center;
  box-shadow:0 2px 12px rgba(0,0,0,.5);
  cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:background .2s,box-shadow .2s;
">
  <svg id="gps-fab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8888aa" stroke-width="2">
    <circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/>
    <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
    <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
  </svg>
</button>



<!-- FILTER BAR -->
<div class="filter-bar" id="filterBar"></div>

<!-- ADD MODE PANEL -->
<div class="add-hint" id="addHint"></div>
<div class="add-panel" id="addPanel">
  <div class="add-panel-text">📍 Tapez sur la carte pour placer une maison</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- BOTTOM NAV -->
<nav class="botnav" id="botnav" style="display:none">
  <button class="bnitem" id="bn-list" onclick="openSheet('list')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1" fill="currentColor"/><circle cx="3" cy="12" r="1" fill="currentColor"/><circle cx="3" cy="18" r="1" fill="currentColor"/></svg>
    Maisons
  </button>
  <button class="bnitem" id="bn-groups" onclick="openSheet('groups')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Groupes
  </button>
  <button class="bnitem bnitem-add" id="bn-add" onclick="toggleAddMode()">

<script>
// ── SHA-256 pur JS (fonctionne sans HTTPS, sans dépendance) ──
function hashPassword(password) {
  // Implémentation SHA-256 pure JS
  function sha256(str) {
    function rr(x,n){return(x>>>n)|(x<<(32-n));}
    const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
             0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
             0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
             0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
             0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
             0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
             0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
             0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    const bytes=[];for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);if(c<128)bytes.push(c);else if(c<2048)bytes.push(192|(c>>6),128|(c&63));else bytes.push(224|(c>>12),128|((c>>6)&63),128|(c&63));}
    const bitLen=bytes.length*8;bytes.push(0x80);while(bytes.length%64!==56)bytes.push(0);
    for(let i=56;i>=0;i-=8)bytes.push((bitLen/Math.pow(2,i))&255);
    for(let i=0;i<bytes.length;i+=64){
      const w=[];for(let j=0;j<16;j++)w[j]=(bytes[i+j*4]<<24)|(bytes[i+j*4+1]<<16)|(bytes[i+j*4+2]<<8)|bytes[i+j*4+3];
      for(let j=16;j<64;j++){const s0=rr(w[j-15],7)^rr(w[j-15],18)^(w[j-15]>>>3);const s1=rr(w[j-2],17)^rr(w[j-2],19)^(w[j-2]>>>10);w[j]=(w[j-16]+s0+w[j-7]+s1)>>>0;}
      let[a,b,c,d,e,f,g,h]=[...H];
      for(let j=0;j<64;j++){const S1=rr(e,6)^rr(e,11)^rr(e,25);const ch=(e&f)^(~e&g);const t1=(h+S1+ch+K[j]+w[j])>>>0;const S0=rr(a,2)^rr(a,13)^rr(a,22);const maj=(a&b)^(a&c)^(b&c);const t2=(S0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;}
      H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
    }
    return H.map(x=>x.toString(16).padStart(8,'0')).join('');
  }
  return Promise.resolve(sha256(password));
}

// Injecter CSS animation une seule fois
function injectGpsStyle(){
  if(document.getElementById('gps-style')) return;
  const s=document.createElement('style');s.id='gps-style';
  s.textContent=`
    @keyframes gpsPulse{0%{transform:scale(.6);opacity:.9}70%{transform:scale(2.4);opacity:0}100%{transform:scale(.6);opacity:0}}
  `;
  document.head.appendChild(s);
}

// Icône flèche SVG orientée selon le cap
function buildArrowIcon(heading, color='#5b8af0', size=32){
  const rot = heading !== null ? heading : 0;
  const hasHeading = heading !== null;
  return L.divIcon({
    html:`<div style="width:${size}px;height:${size}px;position:relative;display:flex;align-items:center;justify-content:center">
      ${hasHeading?'':
        // Pas de cap : cercle pulsant
        `<div style="position:absolute;width:${size*1.5}px;height:${size*1.5}px;border-radius:50%;
          background:${color}22;animation:gpsPulse 2s ease-out infinite"></div>`
      }
      <!-- Cercle de précision -->
      <div style="position:absolute;width:${size}px;height:${size}px;border-radius:50%;
        background:${color}15;border:1.5px solid ${color}55"></div>
      <!-- Flèche SVG orientée -->
      <svg width="${size*.75}" height="${size*.75}" viewBox="0 0 24 24"
        style="transform:rotate(${rot}deg);transition:transform .3s;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));flex-shrink:0"
        fill="${color}" stroke="white" stroke-width="1.2">
        <!-- Corps de la flèche -->
        <path d="M12 3 L17 19 L12 15 L7 19 Z"/>
      </svg>
    </div>`,
    className:'',iconSize:[size,size],iconAnchor:[size/2,size/2]
  });
}

// Icône pour les autres membres (flèche colorée avec initiale)
function buildPeerIcon(userId, heading, color='#f97316'){
  const initial = userId.slice(-2).toUpperCase();

  return L.divIcon({

        background:${color}20;border:1.5px solid ${color}66"></div>
      <svg width="20" height="20" viewBox="0 0 24 24"
        style="transform:rotate(${rot}deg);transition:transform .3s;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));position:absolute"
        fill="${color}" stroke="white" stroke-width="1.2">
        <path d="M12 3 L17 19 L12 15 L7 19 Z"/>
      </svg>
      <div style="position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
        background:${color};color:#fff;font-size:9px;font-weight:700;font-family:'DM Sans',sans-serif;
        padding:1px 5px;border-radius:6px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.4)">

      </div>
    </div>`,
    className:'',iconSize:[36,44],iconAnchor:[18,18]
  });
}

const PEER_COLORS = ['#f97316','#22c55e','#a855f7','#ec4899','#eab308','#ef4444'];
function peerColor(userId){ let h=0;for(const c of userId)h=(h*31+c.charCodeAt(0))%PEER_COLORS.length;return PEER_COLORS[h]; }

// ── Démarrer le suivi GPS ──
function startGpsTracking(){
  if(!navigator.geolocation){showToast('Géolocalisation non disponible');return;}
  injectGpsStyle();

  // 1. Position GPS
  gpsWatchId = navigator.geolocation.watchPosition(pos=>{
    const latlng=[pos.coords.latitude,pos.coords.longitude];
    const acc=pos.coords.accuracy;

    if(!gpsMarker){
      gpsCircle=L.circle(latlng,{radius:acc,color:'#5b8af0',fillColor:'#5b8af0',
        fillOpacity:.07,weight:1,opacity:.3,interactive:false}).addTo(map);
      gpsMarker=L.marker(latlng,{icon:buildArrowIcon(gpsHeading),zIndexOffset:1000,interactive:false}).addTo(map);
      map.setView(latlng,17,{animate:true});
      showToast('📡 GPS activé');
    } else {
      gpsMarker.setLatLng(latlng);
      gpsCircle.setLatLng(latlng);
      gpsCircle.setRadius(acc);
    }

    // Broadcast pour les autres
    broadcastPosition(pos.coords.latitude, pos.coords.longitude, gpsHeading);

  }, err=>{ showToast('⚠️ GPS : '+err.message); stopGpsTracking(); },
  {enableHighAccuracy:true,maximumAge:3000,timeout:15000});

  // 2. Orientation (boussole téléphone)
  if(window.DeviceOrientationEvent){
    const handler = e=>{
      // Sur iOS : e.webkitCompassHeading ; ailleurs : 360 - e.alpha
      const h = (e.webkitCompassHeading != null)
        ? e.webkitCompassHeading
        : (e.alpha != null ? (360 - e.alpha) % 360 : null);
      if(h===null) return;
      gpsHeading = h;
      if(gpsMarker) gpsMarker.setIcon(buildArrowIcon(h));
    };
    // iOS 13+ nécessite une permission
    if(typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().then(r=>{
        if(r==='granted') window.addEventListener('deviceorientation',handler,true);
      }).catch(()=>{});
    } else {
      window.addEventListener('deviceorientation',handler,true);
    }
    gpsOrientWatchId = handler;
  }

  // Démarrer l'écoute des pairs AVANT de broadcaster
  setupPeerTracking();
  gpsActive=true; updateGpsBtn();
}

function stopGpsTracking(){
  if(gpsWatchId!==null){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;}
  if(gpsOrientWatchId){window.removeEventListener('deviceorientation',gpsOrientWatchId,true);gpsOrientWatchId=null;}
  if(gpsMarker){map.removeLayer(gpsMarker);gpsMarker=null;}
  if(gpsCircle){map.removeLayer(gpsCircle);gpsCircle=null;}
  gpsHeading=null; gpsActive=false; updateGpsBtn();
  // Supprimer sa présence
  stopPeerTracking();
  try { sb.from('user_presence').delete().eq('user_id',myUserId).then(()=>{}); } catch(e){}
  showToast('Suivi GPS désactivé');
}

function toggleGps(){ gpsActive ? stopGpsTracking() : startGpsTracking(); }

function updateGpsBtn(){
  const btn=document.getElementById('gps-fab'); if(!btn)return;

  }
}

// ── Présence temps réel ──
// ── GPS TEMPS RÉEL — upsert Supabase + polling léger ──
let broadcastTimer = null;
let peerChannel = null;

function broadcastPosition(lat, lng, heading){
  clearTimeout(broadcastTimer);
  broadcastTimer = setTimeout(async ()=>{
    try {
      await sb.from('user_presence').upsert({
        user_id: myUserId,
        role: userRole||'member',
        lat, lng,
        heading: heading||0,
        updated_at: new Date().toISOString()
      }, {onConflict:'user_id'});
    } catch(e){}
  }, 800);
}

function setupPeerTracking(){
  if(peerChannel) return;
  peerChannel = sb.channel('peer-gps')
    .on('postgres_changes',{event:'*',schema:'public',table:'user_presence'}, payload=>{
      const row = payload.new || payload.old;
      if(!row || row.user_id === myUserId) return;
      if(payload.eventType === 'DELETE'){
        if(peerMarkers[row.user_id]){ map.removeLayer(peerMarkers[row.user_id]); delete peerMarkers[row.user_id]; }
        return;
      }
      const color = peerColor(row.user_id);
      const latlng = [row.lat, row.lng];
      if(!peerMarkers[row.user_id]){
        peerMarkers[row.user_id] = L.marker(latlng,{icon:buildPeerIcon(row.user_id,row.heading,color),zIndexOffset:900,interactive:false}).addTo(map);
      } else {
        peerMarkers[row.user_id].setLatLng(latlng);
        peerMarkers[row.user_id].setIcon(buildPeerIcon(row.user_id,row.heading,color));
      }
    })
    .subscribe();
}

function stopPeerTracking(){
  if(peerChannel){ sb.removeChannel(peerChannel); peerChannel=null; }
  Object.values(peerMarkers).forEach(m=>map.removeLayer(m));
  peerMarkers={};
}

function gc(h){const g=groups.find(x=>x.id===h.group_id);return g?g.color:ST[h.status]?.color||'#5b8af0';}
function mkIcon(h){
  const sel = h.id === selId;
  const groupColor  = gc(h);                          // couleur du groupe (ou statut si pas de groupe)
  const statusColor = ST[h.status]?.color || '#5b8af0'; // couleur du statut
  const w = sel ? 36 : 26;
  const h2 = sel ? 44 : 32;  // hauteur pin = w * 1.22 environ
  const r = sel ? 10 : 7;    // border-radius du corps
  const tailH = sel ? 10 : 7;
  const bw = sel ? 3 : 2;

  const html = `
    <div style="position:relative;width:${w}px;height:${h2+tailH}px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.7))${sel?` drop-shadow(0 0 8px ${groupColor}88)`:''};transition:all .15s">
      <!-- Corps du pin -->
      <div style="
        width:${w}px;height:${h2}px;border-radius:${r}px ${r}px ${r*.6}px ${r*.6}px;
        background:${statusColor};
        border:${bw}px solid ${groupColor};
        display:flex;align-items:center;justify-content:center;
        position:relative;
      ">
        <!-- Pastille groupe au centre -->
        <div style="
          width:${w*.35}px;height:${w*.35}px;border-radius:50%;
          background:${groupColor};
          border:1.5px solid rgba(255,255,255,.5);
          flex-shrink:0;
        "></div>
      </div>
      <!-- Pointe du pin -->
      <div style="
        width:0;height:0;
        border-left:${Math.round(w*.3)}px solid transparent;
        border-right:${Math.round(w*.3)}px solid transparent;
        border-top:${tailH}px solid ${groupColor};
        margin:0 auto;
      "></div>
      ${sel ? `<div style="position:absolute;inset:-5px 0 ${tailH}px;border-radius:${r+3}px;border:1.5px solid rgba(255,255,255,.25);pointer-events:none"></div>` : ''}
    </div>`;

  return L.divIcon({
    html,
    className:'',
    iconSize: [w, h2+tailH],
    iconAnchor: [w/2, h2+tailH]   // pointe en bas
  });
}
function addM(h){
  const m=L.marker([h.lat,h.lng],{icon:mkIcon(h)}).addTo(map);
  m.bindTooltip(h.name,{permanent:false,direction:'top',offset:[0,-14]});
  m.on('click',e=>{
    if(addMode||moveMode){L.DomEvent.stopPropagation(e);return;}
    L.DomEvent.stopPropagation(e);sel(h.id);
  });
  markers[h.id]=m;
}
function refreshM(id){const h=houses.find(x=>x.id===id);if(h&&markers[id]){markers[id].setIcon(mkIcon(h));markers[id].setTooltipContent(h.name);}}

  houses.forEach(h=>{
    const g=groups.find(x=>x.id===h.group_id);
    rows.push([h.name,ST[h.status]?.label||h.status,g?.name||'',h.amount||0,h.note||'',h.lat,h.lng]);
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`collecte_${ed?.id||'export'}.csv`;a.click();
}

// ═══════════════════════════════════════
// DATABASE
// ═══════════════════════════════════════
async function dbInsertHouse(h){
  setSyncState('loading');
  const {error}=await sb.from('houses').insert({id:h.id,edition_id:h.edition_id,name:h.name,lat:h.lat,lng:h.lng,status:h.status,note:h.note,amount:h.amount||0,group_id:h.group_id});
  setSyncState(error?'err':'ok');if(error)showToast('⚠️ Erreur sauvegarde');
}
async function dbUpdateHouse(h){
  setSyncState('loading');
  const {error}=await sb.from('houses').update({name:h.name,status:h.status,note:h.note,amount:h.amount||0,group_id:h.group_id,lat:h.lat,lng:h.lng}).eq('id',h.id);
  setSyncState(error?'err':'ok');if(error)showToast('⚠️ Erreur mise à jour');
}

// ═══════════════════════════════════════
// REALTIME
// ═══════════════════════════════════════
function setupRealtime(){
  try {
    sb.channel('db-changes')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'houses'},payload=>{
        const h=payload.new;
        if(h.edition_id!==currentEditionId)return;
        if(!houses.find(x=>x.id===h.id)){houses.push(h);addM(h);renderList();renderGroups();updateFilter();showToast('📍 ajoutée');}
      })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'houses'},payload=>{
        const h=payload.new;
        if(h.edition_id!==currentEditionId)return;
        const idx=houses.findIndex(x=>x.id===h.id);
        if(idx>-1){houses[idx]={...houses[idx],...h};refreshM(h.id);renderList();renderGroups();updateFilter();if(selId===h.id)openHouseSheet(h.id);}
      })
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'houses'},payload=>{
        const id=payload.old.id;
        if(houses.find(x=>x.id===id)){removeM(id);houses=houses.filter(x=>x.id!==id);if(selId===id){selId=null;closeSheet('house');}renderList();renderGroups();updateFilter();}
      })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'groups'},payload=>{
        const g=payload.new;if(!groups.find(x=>x.id===g.id)&&g.edition_id===currentEditionId){groups.push(g);renderGroups();}
      })
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'groups'},payload=>{
        const id=payload.old.id;groups=groups.filter(x=>x.id!==id);
        houses.forEach(h=>{if(h.group_id===id)h.group_id=null;});renderGroups();renderList();
      })
      .subscribe();
  } catch(e){ console.warn('Realtime:', e.message); }
}

// ═══════════════════════════════════════
// LOAD EDITION DATA
// ═══════════════════════════════════════
async function loadEditionData(eid){
  const {data:gData}=await sb.from('groups').select('*').eq('edition_id',eid).order('created_at');
  groups=gData||[];
  const {data:hData}=await sb.from('houses').select('*').eq('edition_id',eid).order('created_at');
  houses=hData||[];
  houses.forEach(h=>addM(h));
  renderList();renderGroups();updateFilter();renderCPicker();
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
async function init(){
  setSyncState('loading');document.getElementById('tbCount').textContent='Chargement…';
  try {
    const {data:eData,error:eErr}=await sb.from('editions').select('*').order('year');
    if(eErr)throw eErr;
    editions=eData||[];
    const active=editions.find(e=>e.is_active)||editions[0];
    if(!active){
      document.getElementById('tbCount').textContent='Aucune édition';
      setSyncState('ok');return;
    }
    currentEditionId=active.id;
    
    await loadEditionData(active.id);
    setSyncState('ok');setupRealtime();
  } catch(err){
    console.error(err);setSyncState('err');
    document.getElementById('tbCount').textContent='Erreur connexion';
    showToast('⚠️ Impossible de se connecter',4000);
  }
}
</script>
