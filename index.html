<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Arrosako Etxekurriak</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#09090e;--surface:#111116;--s2:#17171e;--s3:#1e1e27;
  --border:#252530;--b2:#323240;
  --text:#ededf5;--muted:#606080;--m2:#8888aa;
  --accent:#5b8af0;--ag:rgba(91,138,240,.2);
  --green:#22c55e;--amber:#f59e0b;
  --nav-h:60px;--safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}

#map{position:fixed;inset:0;z-index:1;top:52px;bottom:calc(var(--nav-h) + var(--safe-b));}
#map.add-mode{cursor:crosshair}

.topbar{
  position:fixed;top:0;left:0;right:0;height:52px;z-index:600;
  background:rgba(9,9,14,.88);border-bottom:1px solid var(--border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;padding:0 14px;gap:10px;
}
.tb-brand{font-size:14px;font-weight:600;flex:1;letter-spacing:-.2px}
.tb-brand span{color:var(--muted);font-weight:400;font-size:12px}
.tb-pill{
  display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:14px;
  background:var(--s2);border:1px solid var(--border);
  font-size:11px;font-weight:500;color:var(--m2);
  white-space:nowrap;
}
.tb-dot{width:5px;height:5px;border-radius:50%}

/* ── SYNC INDICATOR ── */
.sync-dot{
  width:7px;height:7px;border-radius:50%;background:var(--muted);
  flex-shrink:0;transition:background .3s;
}
.sync-dot.ok{background:var(--green)}
.sync-dot.err{background:#ef4444}
.sync-dot.loading{background:var(--amber);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.botnav{
  position:fixed;bottom:0;left:0;right:0;z-index:600;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(9,9,14,.94);border-top:1px solid var(--border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;align-items:stretch;
}
.bnitem{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;cursor:pointer;
  background:transparent;border:none;color:var(--muted);
  font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;
  transition:color .15s;padding:0;
}
.bnitem.on{color:var(--accent)}
.bnitem svg{width:22px;height:22px;stroke-width:1.8}
.bnitem-add{flex:1.4;}
.bnitem-add .add-circle{
  width:46px;height:46px;border-radius:50%;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 4px var(--ag),0 4px 20px rgba(91,138,240,.5);
  transition:all .15s;margin-bottom:1px;
}
.bnitem-add.on .add-circle{background:#ef4444;box-shadow:0 0 0 4px rgba(239,68,68,.2),0 4px 20px rgba(239,68,68,.4)}
.bnitem-add .add-circle svg{width:24px;height:24px;stroke:#fff;stroke-width:2.2}

.sheet{
  position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b));
  z-index:500;background:var(--surface);
  border-radius:16px 16px 0 0;border-top:1px solid var(--b2);
  box-shadow:0 -8px 40px rgba(0,0,0,.6);
  transform:translateY(100%);
  transition:transform .28s cubic-bezier(.32,0,.2,1);
  display:flex;flex-direction:column;max-height:80vh;overflow:hidden;
}
.sheet.open{transform:translateY(0)}

.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--b2);margin:10px auto 0;flex-shrink:0;}
.sheet-title{
  padding:12px 18px 10px;font-size:15px;font-weight:600;
  border-bottom:1px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;gap:10px;
}
.sheet-title span{flex:1}
.sheet-close{
  width:28px;height:28px;border-radius:50%;border:1px solid var(--border);
  background:var(--s2);color:var(--muted);font-size:14px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.sheet-body{flex:1;overflow-y:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px}
.sheet-body::-webkit-scrollbar{display:none}

.sh-name{font-size:16px;font-weight:600}
.sh-meta{font-size:12px;color:var(--muted)}
.sh-sec{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

.st-row{display:flex;gap:8px}
.st-btn{
  flex:1;padding:11px 6px;border-radius:12px;
  font-size:12px;font-weight:600;border:1.5px solid;
  cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:all .15s;text-align:center;
}

.grp-sel{
  width:100%;padding:12px 14px;border-radius:12px;font-size:14px;
  background:var(--s2);border:1px solid var(--border);color:var(--text);
  font-family:'DM Sans',sans-serif;
  -webkit-appearance:none;appearance:none;
}
.grp-sel:focus{outline:none;border-color:var(--accent)}

.note-ta{
  width:100%;padding:10px 12px;border-radius:12px;font-size:14px;
  background:var(--s2);border:1px solid var(--border);color:var(--text);
  font-family:'DM Sans',sans-serif;resize:none;min-height:70px;
}
.note-ta:focus{outline:none;border-color:var(--accent)}

.sh-actions{display:flex;gap:8px}
.sh-btn{
  flex:1;padding:13px;border-radius:12px;font-size:14px;font-weight:600;
  border:1px solid var(--border);background:var(--s2);color:var(--text);
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;
}
.sh-btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.sh-btn-del{border-color:#ef4444;color:#ef4444;background:transparent}

.list-search{
  width:100%;padding:11px 14px;border-radius:12px;font-size:14px;
  background:var(--s2);border:1px solid var(--border);color:var(--text);
  font-family:'DM Sans',sans-serif;flex-shrink:0;
}
.list-search:focus{outline:none;border-color:var(--accent)}
.list-search::placeholder{color:var(--muted)}

.hlist{display:flex;flex-direction:column;gap:4px}
.hi{padding:12px 14px;border-radius:12px;background:var(--s2);border:1px solid transparent;cursor:pointer;}
.hi.sel{border-color:var(--accent);background:rgba(91,138,240,.07)}
.hi-row{display:flex;align-items:center;gap:9px}
.hi-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hi-label{font-size:14px;font-weight:500;flex:1}
.hi-badge{font-size:11px;padding:2px 8px;border-radius:8px;font-weight:500}
.hi-sub{font-size:11.5px;color:var(--muted);margin-top:3px;padding-left:17px}

.gcard{border-radius:12px;border:1px solid var(--border);background:var(--s2);overflow:hidden;margin-bottom:6px}
.gheader{padding:12px 14px;display:flex;align-items:center;gap:10px}
.gcol{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.gname{font-size:14px;font-weight:600;flex:1}
.gcnt{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--s3);color:var(--m2)}
.gbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.gbar-wrap{margin:0 14px 8px;height:3px;background:var(--s3);border-radius:2px;overflow:hidden}
.gbar{height:100%;border-radius:2px;transition:width .4s}
.gsub{padding:0 14px 8px;font-size:11px;color:var(--muted)}
.gmems{padding:0 10px 10px;display:flex;flex-direction:column;gap:3px}
.gmem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;background:var(--s3);font-size:13px;cursor:pointer;}
.gmdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.gmname{flex:1}
.gmrm{width:26px;height:26px;border-radius:7px;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.gempty{padding:8px 14px 12px;font-size:12px;color:var(--muted);font-style:italic}

.new-g-btn{
  padding:14px;border-radius:12px;width:100%;
  background:transparent;border:1.5px dashed var(--b2);
  color:var(--muted);font-size:14px;cursor:pointer;
  font-family:'DM Sans',sans-serif;
}

.minput{width:100%;padding:12px 14px;border-radius:12px;font-size:14px;background:var(--s2);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;}
.minput:focus{outline:none;border-color:var(--accent)}
.mlabel{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.cpicker{display:flex;gap:10px;flex-wrap:wrap;padding:4px 0}
.cp{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .15s}
.cp.on{border-color:#fff;transform:scale(1.15)}

.add-hint{
  position:fixed;top:64px;left:50%;transform:translateX(-50%);
  background:var(--accent);color:#fff;
  padding:8px 20px;border-radius:20px;
  font-size:13px;font-weight:600;
  z-index:700;box-shadow:0 4px 20px rgba(91,138,240,.5);
  pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;
}
.add-hint.show{opacity:1}

.filter-bar{
  position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 8px);left:12px;right:12px;
  z-index:400;display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none;
}
.filter-bar::-webkit-scrollbar{display:none}
.fpill{
  flex-shrink:0;display:flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:14px;
  background:rgba(9,9,14,.85);border:1px solid var(--border);
  font-size:11.5px;font-weight:500;color:var(--m2);cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;
}
.fpill.on{border-color:var(--accent);background:rgba(9,9,14,.95);color:var(--accent)}
.fdot{width:6px;height:6px;border-radius:50%}

.empty-st{padding:32px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.empty-st .ei{font-size:32px;display:block;margin-bottom:8px}

/* Toast notification */
.toast{
  position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:var(--s3);border:1px solid var(--b2);color:var(--text);
  padding:8px 18px;border-radius:14px;font-size:13px;font-weight:500;
  z-index:900;transition:transform .25s cubic-bezier(.32,0,.2,1);
  white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.5);
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Rename input in house sheet */
.sh-name-input{
  width:100%;padding:8px 12px;border-radius:10px;font-size:15px;font-weight:600;
  background:var(--s2);border:1px solid var(--b2);color:var(--text);
  font-family:'DM Sans',sans-serif;
}
.sh-name-input:focus{outline:none;border-color:var(--accent)}

.leaflet-control-zoom{margin:10px 10px 0 0!important}
.leaflet-control-zoom a{width:36px!important;height:36px!important;line-height:36px!important;font-size:18px!important;background:rgba(9,9,14,.85)!important;color:var(--text)!important;border-color:var(--border)!important;}
.leaflet-control-attribution{font-size:8px!important;background:rgba(9,9,14,.6)!important;color:var(--muted)!important}
.leaflet-tooltip{background:rgba(17,17,22,.96)!important;border:1px solid var(--b2)!important;color:var(--text)!important;font-family:'DM Sans',sans-serif!important;font-size:12px!important;font-weight:500!important;border-radius:8px!important;padding:5px 12px!important;}
.leaflet-tooltip-top::before{border-top-color:var(--b2)!important}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="tb-brand">St-Martin-d'Arrossa </div>
  <div id="tbPill" class="tb-pill">
    <div class="sync-dot loading" id="syncDot"></div>
    <span id="tbCount">Connexion…</span>
  </div>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- FILTER BAR -->
<div class="filter-bar" id="filterBar"></div>

<!-- ADD MODE HINT -->
<div class="add-hint" id="addHint">📍 Tapez sur la carte pour placer</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- BOTTOM NAV -->
<nav class="botnav">
  <button class="bnitem" id="bn-list" onclick="openSheet('list')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1" fill="currentColor"/><circle cx="3" cy="12" r="1" fill="currentColor"/><circle cx="3" cy="18" r="1" fill="currentColor"/></svg>
    Maisons
  </button>
  <button class="bnitem" id="bn-groups" onclick="openSheet('groups')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Groupes
  </button>
  <button class="bnitem bnitem-add" id="bn-add" onclick="toggleAddMode()">
    <div class="add-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" id="addIcon"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </div>
    <span id="addLabel">Ajouter</span>
  </button>
</nav>

<!-- HOUSE DETAIL SHEET -->
<div class="sheet" id="sheet-house">
  <div class="sheet-handle"></div>
  <div class="sheet-title">
    <span id="sh-name">—</span>
    <div class="sheet-close" onclick="closeSheet('house')">✕</div>
  </div>
  <div class="sheet-body">
    <div>
      <div class="sh-sec">Nom</div>
      <input class="sh-name-input" id="sh-name-edit" placeholder="Nom de la maison…"/>
    </div>
    <div id="sh-meta" style="font-size:12px;color:var(--muted);margin-top:-4px"></div>
    <div>
      <div class="sh-sec">Statut</div>
      <div class="st-row" id="sh-status"></div>
    </div>
    <div>
      <div class="sh-sec">Groupe</div>
      <select class="grp-sel" id="sh-group" onchange="assignGroup()"></select>
    </div>
    <div>
      <div class="sh-sec">Note</div>
      <textarea class="note-ta" id="sh-note" rows="3" placeholder="Ajouter une note…"></textarea>
    </div>
    <div class="sh-actions">
      <button class="sh-btn sh-btn-accent" onclick="saveHouse()">Sauvegarder</button>
      <button class="sh-btn" onclick="closeSheet('house')">Fermer</button>
      <button class="sh-btn sh-btn-del" onclick="deleteSel()" style="flex:.6">🗑</button>
    </div>
  </div>
</div>

<!-- LIST SHEET -->
<div class="sheet" id="sheet-list">
  <div class="sheet-handle"></div>
  <div class="sheet-title">
    <span>Maisons</span>
    <div class="sheet-close" onclick="closeSheet('list')">✕</div>
  </div>
  <div class="sheet-body">
    <input class="list-search" id="search" placeholder="Rechercher…" oninput="renderList()"/>
    <div class="hlist" id="hlist"></div>
  </div>
</div>

<!-- GROUPS SHEET -->
<div class="sheet" id="sheet-groups">
  <div class="sheet-handle"></div>
  <div class="sheet-title">
    <span>Groupes</span>
    <div class="sheet-close" onclick="closeSheet('groups')">✕</div>
  </div>
  <div class="sheet-body">
    <div id="glist"></div>
    <button class="new-g-btn" onclick="openSheet('addgroup')">＋ Créer un groupe</button>
  </div>
</div>

<!-- ADD GROUP SHEET -->
<div class="sheet" id="sheet-addgroup">
  <div class="sheet-handle"></div>
  <div class="sheet-title">
    <span>Nouveau groupe</span>
    <div class="sheet-close" onclick="closeSheet('addgroup')">✕</div>
  </div>
  <div class="sheet-body">
    <div>
      <div class="mlabel">Nom</div>
      <input class="minput" id="gName" placeholder="ex : Rue principale…"/>
    </div>
    <div>
      <div class="mlabel">Couleur</div>
      <div class="cpicker" id="cpicker"></div>
    </div>
    <div class="sh-actions">
      <button class="sh-btn sh-btn-accent" onclick="confirmAddGroup()">Créer</button>
      <button class="sh-btn" onclick="closeSheet('addgroup')">Annuler</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ═══════════════════════════════════════
// ⚙️  CONFIGURATION SUPABASE
// Remplace ces deux valeurs par les tiennes :
// Supabase > Settings > API
// ═══════════════════════════════════════
const SUPABASE_URL = 'https://ljetbkjztjehrebhhbsc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxqZXRia2p6dGplaHJlYmhoYnNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNDI1NDUsImV4cCI6MjA5MzgxODU0NX0.Km-EodOaOIC8BjUJbkwsWfGPoazCzVSjzE1fbNOHsBk';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ═══════════════════════════════════════
// CONFIG STATUTS
// ═══════════════════════════════════════
const ST = {
  à_visiter:{label:'À visiter', color:'#5b8af0'},
  visité:   {label:'Visité',    color:'#22c55e'},
  absent:   {label:'Absent',    color:'#f59e0b'},
};
const GC = ['#5b8af0','#f472b6','#fb923c','#a78bfa','#34d399','#fbbf24','#60a5fa','#f87171','#e879f9','#4ade80'];

let groups = [];
let houses = [];
let selId  = null, markers = {}, addMode = false, fStatus = null, selColor = GC[0];
let activeSheet = null;
let saving = false;

// ═══════════════════════════════════════
// TOAST
// ═══════════════════════════════════════
let toastTimer;
function showToast(msg, duration=2200){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), duration);
}

// ═══════════════════════════════════════
// SYNC DOT
// ═══════════════════════════════════════
function setSyncState(state){ // 'loading' | 'ok' | 'err'
  const d=document.getElementById('syncDot');
  d.className='sync-dot '+state;
}

// ═══════════════════════════════════════
// MAP
// ═══════════════════════════════════════
const map = L.map('map', {center:[43.2388,-1.3128], zoom:17, zoomControl:true, tap:true});

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
  attribution:'© Esri', maxZoom:20
}).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',{
  attribution:'© CartoDB', maxZoom:20, opacity:.65
}).addTo(map);

map.on('click', async e => {
  if (!addMode) return;
  const id = Date.now(); // ID numérique unique
  const h = {id, name:`Maison ${houses.length+1}`, lat:e.latlng.lat, lng:e.latlng.lng,
              status:'à_visiter', note:'', group_id:null};
  // Optimistic UI
  houses.push(h);
  addM(h); flashM(id);
  renderList(); renderGroups(); updateFilter();
  // Persist
  await dbInsertHouse(h);
});

map.on('click', () => { if (!addMode && activeSheet && activeSheet !== 'house') closeSheet(activeSheet); });
document.addEventListener('keydown', e => { if(e.key==='Escape' && addMode) toggleAddMode(); });

// ═══════════════════════════════════════
// ADD MODE
// ═══════════════════════════════════════
function toggleAddMode() {
  addMode = !addMode;
  const btn=document.getElementById('bn-add'), hint=document.getElementById('addHint');
  const mapEl=document.getElementById('map'), icon=document.getElementById('addIcon'), lbl=document.getElementById('addLabel');
  if (addMode) {
    btn.classList.add('on'); hint.classList.add('show'); mapEl.classList.add('add-mode');
    icon.innerHTML='<line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/>';
    lbl.textContent='Quitter'; closeSheet(activeSheet);
  } else {
    btn.classList.remove('on'); hint.classList.remove('show'); mapEl.classList.remove('add-mode');
    icon.innerHTML='<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>';
    lbl.textContent='Ajouter';
  }
}

function flashM(id) {
  if (!markers[id]) return;
  const el=markers[id].getElement(); if (!el) return;
  const inner=el.querySelector('div'); if (!inner) return;
  inner.style.transition='transform .12s'; inner.style.transform='scale(1.7)';
  setTimeout(()=>{ inner.style.transform='scale(1)'; }, 150);
}

// ═══════════════════════════════════════
// SHEETS
// ═══════════════════════════════════════
const SHEETS = ['house','list','groups','addgroup'];
function openSheet(name) {
  SHEETS.forEach(s => { if(s!==name) document.getElementById('sheet-'+s).classList.remove('open'); });
  document.getElementById('sheet-'+name).classList.add('open');
  activeSheet = name;
  document.getElementById('bn-list').classList.toggle('on', name==='list');
  document.getElementById('bn-groups').classList.toggle('on', name==='groups');
  if(name==='list')   renderList();
  if(name==='groups') renderGroups();
}
function closeSheet(name) {
  if (!name) return;
  document.getElementById('sheet-'+name).classList.remove('open');
  if(activeSheet===name) activeSheet=null;
  if(name==='house'){ const p=selId; selId=null; if(p)refreshM(p); renderList(); }
  document.getElementById('bn-list').classList.remove('on');
  document.getElementById('bn-groups').classList.remove('on');
}

// ═══════════════════════════════════════
// MARKERS
// ═══════════════════════════════════════
function gc(h){const g=groups.find(x=>x.id===h.group_id);return g?g.color:ST[h.status]?.color||'#5b8af0';}
function mkIcon(h){
  const s=h.id===selId, c=gc(h), sc=ST[h.status]?.color||'#5b8af0', sz=s?40:28;
  return L.divIcon({
    html:`<div style="width:${sz}px;height:${sz}px;border-radius:50%;
      background:${c}18;border:${s?3:2}px solid ${c};
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 0 ${s?18:6}px ${c}66,0 2px 8px rgba(0,0,0,.7);
      position:relative;transition:all .15s">
      <div style="width:${sz*.38}px;height:${sz*.38}px;border-radius:50%;background:${sc}"></div>
      ${s?`<div style="position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3)"></div>`:''}
    </div>`,
    className:'', iconSize:[sz,sz], iconAnchor:[sz/2,sz/2]
  });
}
function addM(h){
  const m=L.marker([h.lat,h.lng],{icon:mkIcon(h)}).addTo(map);
  m.bindTooltip(h.name,{permanent:false,direction:'top',offset:[0,-14]});
  m.on('click', e=>{
    if(addMode){L.DomEvent.stopPropagation(e);return;}
    L.DomEvent.stopPropagation(e); sel(h.id);
  });
  markers[h.id]=m;
}
function refreshM(id){const h=houses.find(x=>x.id===id);if(h&&markers[id]){markers[id].setIcon(mkIcon(h));markers[id].setTooltipContent(h.name);}}
function removeM(id){if(markers[id]){map.removeLayer(markers[id]);delete markers[id];}}

// ═══════════════════════════════════════
// SELECT
// ═══════════════════════════════════════
function sel(id){
  const p=selId; selId=id;
  if(p) refreshM(p);
  refreshM(id);
  renderList();
  openHouseSheet(id);
  const h=houses.find(x=>x.id===id);
  if(h) map.panTo([h.lat,h.lng],{animate:true,duration:.3});
}

function openHouseSheet(id){
  const h=houses.find(x=>x.id===id); if(!h) return;
  const g=groups.find(x=>x.id===h.group_id);
  document.getElementById('sh-name').textContent = h.name;
  document.getElementById('sh-name-edit').value  = h.name;
  document.getElementById('sh-meta').textContent = g?`Groupe : ${g.name}`:'Aucun groupe';
  document.getElementById('sh-note').value       = h.note||'';

  document.getElementById('sh-status').innerHTML = Object.entries(ST).map(([k,cfg])=>`
    <button class="st-btn" style="border-color:${cfg.color};color:${h.status===k?'#09090e':cfg.color};background:${h.status===k?cfg.color:'transparent'}"
      onclick="setSt(${id},'${k}')">${cfg.label}</button>`).join('');

  document.getElementById('sh-group').innerHTML =
    `<option value="">— Aucun groupe —</option>`+
    groups.map(g=>`<option value="${g.id}"${h.group_id===g.id?' selected':''}>${g.name}</option>`).join('');

  openSheet('house');
}

function setSt(id,s){
  const h=houses.find(x=>x.id===id);
  if(h){h.status=s;refreshM(id);openHouseSheet(id);renderList();updateFilter();dbUpdateHouse(h);}
}

async function saveHouse(){
  if(!selId)return;
  const h=houses.find(x=>x.id===selId); if(!h)return;
  h.name=document.getElementById('sh-name-edit').value.trim()||h.name;
  h.note=document.getElementById('sh-note').value;
  h.group_id=document.getElementById('sh-group').value||null;
  document.getElementById('sh-name').textContent=h.name;
  refreshM(selId); renderList(); renderGroups();
  await dbUpdateHouse(h);
  showToast('✓ Sauvegardé');
}

function assignGroup(){
  if(!selId)return;
  const h=houses.find(x=>x.id===selId); if(!h)return;
  h.group_id=document.getElementById('sh-group').value||null;
  const g=groups.find(x=>x.id===h.group_id);
  document.getElementById('sh-meta').textContent=g?`Groupe : ${g.name}`:'Aucun groupe';
  refreshM(selId); renderList(); renderGroups();
}

async function deleteSel(){
  if(!selId||!confirm('Supprimer cette maison ?'))return;
  const id=selId;
  removeM(id);
  houses=houses.filter(x=>x.id!==id);
  selId=null;
  closeSheet('house');
  renderList();renderGroups();updateFilter();
  await sb.from('houses').delete().eq('id', id);
}

// ═══════════════════════════════════════
// FILTER BAR
// ═══════════════════════════════════════
function updateFilter(){
  const c={};Object.keys(ST).forEach(k=>c[k]=houses.filter(h=>h.status===k).length);
  document.getElementById('filterBar').innerHTML=
    `<div class="fpill${!fStatus?' on':''}" onclick="setF(null)">
      <div class="fdot" style="background:var(--accent)"></div>Tous ${houses.length}</div>`+
    Object.entries(ST).map(([k,cfg])=>
      `<div class="fpill${fStatus===k?' on':''}" onclick="setF('${k}')">
        <div class="fdot" style="background:${cfg.color}"></div>${cfg.label} ${c[k]}</div>`
    ).join('');
  document.getElementById('tbCount').textContent=`${houses.length} maison${houses.length!==1?'s':''}`;
}

function setF(s){
  fStatus=s;updateFilter();renderList();
  houses.forEach(h=>{
    if(!markers[h.id])return;
    (!s||h.status===s)?map.addLayer(markers[h.id]):map.removeLayer(markers[h.id]);
  });
}

// ═══════════════════════════════════════
// RENDER LIST
// ═══════════════════════════════════════
function renderList(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=houses.filter(h=>(!fStatus||h.status===fStatus)&&(!q||h.name.toLowerCase().includes(q)));
  const el=document.getElementById('hlist');
  if(!f.length){
    el.innerHTML=houses.length===0
      ?`<div class="empty-st"><span class="ei">🏠</span>Aucune maison.<br/>Appuyez sur <b>Ajouter</b> puis<br/>tapez sur la carte.</div>`
      :`<div class="empty-st">Aucune maison pour ce filtre.</div>`;
    return;
  }
  el.innerHTML=f.map(h=>{
    const g=groups.find(x=>x.id===h.group_id);
    const s=ST[h.status]||ST['à_visiter'];
    return`<div class="hi${h.id===selId?' sel':''}" onclick="sel(${h.id});closeSheet('list')">
      <div class="hi-row">
        <div class="hi-dot" style="background:${s.color}"></div>
        <span class="hi-label">${h.name}</span>
        ${g?`<span class="hi-badge" style="background:${g.color}1a;color:${g.color}">${g.name}</span>`:''}
      </div>
      <div class="hi-sub">${s.label}${h.note?` · ${h.note.slice(0,28)}…`:''}</div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════
// RENDER GROUPS
// ═══════════════════════════════════════
function renderGroups(){
  const el=document.getElementById('glist');
  if(!groups.length){
    el.innerHTML=`<div class="empty-st"><span class="ei">📦</span>Aucun groupe.<br/>Créez-en un pour organiser<br/>vos tournées.</div>`;
    return;
  }
  el.innerHTML=groups.map(g=>{
    const mems=houses.filter(h=>h.group_id===g.id);
    const v=mems.filter(h=>h.status==='visité').length;
    const pct=mems.length?Math.round(v/mems.length*100):0;
    return`<div class="gcard">
      <div class="gheader">
        <div class="gcol" style="background:${g.color}"></div>
        <span class="gname">${g.name}</span>
        <span class="gcnt">${mems.length}</span>
        <button class="gbtn" onclick="event.stopPropagation();delGroup('${g.id}')">✕</button>
      </div>
      ${mems.length?`
        <div class="gbar-wrap"><div class="gbar" style="width:${pct}%;background:${g.color}"></div></div>
        <div class="gsub">${v}/${mems.length} visités</div>
        <div class="gmems">${mems.map(h=>`
          <div class="gmem" onclick="sel(${h.id});closeSheet('groups')">
            <div class="gmdot" style="background:${ST[h.status]?.color||'#5b8af0'}"></div>
            <span class="gmname">${h.name}</span>
            <span style="font-size:11px;color:var(--muted)">${ST[h.status]?.label||''}</span>
            <button class="gmrm" onclick="event.stopPropagation();rmFromGroup(${h.id})">✕</button>
          </div>`).join('')}
        </div>`:'<div class="gempty">Aucune maison assignée</div>'}
    </div>`;
  }).join('');
}

async function delGroup(gid){
  if(!confirm('Supprimer ce groupe ?'))return;
  groups=groups.filter(x=>x.id!==gid);
  houses.forEach(h=>{if(h.group_id===gid){h.group_id=null;refreshM(h.id);}});
  renderGroups();renderList();
  if(selId)openHouseSheet(selId);
  await sb.from('groups').delete().eq('id', gid);
}
async function rmFromGroup(hid){
  const h=houses.find(x=>x.id===hid);
  if(h){h.group_id=null;refreshM(hid);renderGroups();renderList();await dbUpdateHouse(h);}
}

// ═══════════════════════════════════════
// ADD GROUP
// ═══════════════════════════════════════
function renderCPicker(){
  document.getElementById('cpicker').innerHTML=GC.map(c=>
    `<div class="cp${c===selColor?' on':''}" style="background:${c}" onclick="pickC('${c}')"></div>`).join('');
}
function pickC(c){selColor=c;renderCPicker();}
function openAddGroup(){
  document.getElementById('gName').value='';
  selColor=GC[0];renderCPicker();
  openSheet('addgroup');
}
async function confirmAddGroup(){
  const name=document.getElementById('gName').value.trim();
  if(!name)return;
  const g={id:'g'+Date.now(),name,color:selColor};
  groups.push(g);
  closeSheet('addgroup');
  openSheet('groups');
  await sb.from('groups').insert(g);
}

// ═══════════════════════════════════════
// DATABASE HELPERS
// ═══════════════════════════════════════
async function dbInsertHouse(h){
  setSyncState('loading');
  const {error}=await sb.from('houses').insert({
    id:h.id, name:h.name, lat:h.lat, lng:h.lng,
    status:h.status, note:h.note, group_id:h.group_id
  });
  setSyncState(error?'err':'ok');
  if(error) showToast('⚠️ Erreur de sauvegarde');
}

async function dbUpdateHouse(h){
  setSyncState('loading');
  const {error}=await sb.from('houses').update({
    name:h.name, status:h.status, note:h.note, group_id:h.group_id
  }).eq('id',h.id);
  setSyncState(error?'err':'ok');
  if(error) showToast('⚠️ Erreur de mise à jour');
}

// ═══════════════════════════════════════
// REALTIME — sync entre utilisateurs
// ═══════════════════════════════════════
function setupRealtime(){
  sb.channel('db-changes')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'houses'}, payload=>{
      const h=payload.new;
      if(!houses.find(x=>x.id===h.id)){
        houses.push(h); addM(h); renderList(); renderGroups(); updateFilter();
        showToast(`📍 ${h.name} ajoutée`);
      }
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'houses'}, payload=>{
      const h=payload.new;
      const idx=houses.findIndex(x=>x.id===h.id);
      if(idx>-1){
        houses[idx]={...houses[idx],...h};
        refreshM(h.id); renderList(); renderGroups(); updateFilter();
        if(selId===h.id) openHouseSheet(h.id);
      }
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'houses'}, payload=>{
      const id=payload.old.id;
      if(houses.find(x=>x.id===id)){
        removeM(id); houses=houses.filter(x=>x.id!==id);
        if(selId===id){selId=null;closeSheet('house');}
        renderList(); renderGroups(); updateFilter();
      }
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'groups'}, payload=>{
      const g=payload.new;
      if(!groups.find(x=>x.id===g.id)){groups.push(g);renderGroups();}
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'groups'}, payload=>{
      const id=payload.old.id;
      groups=groups.filter(x=>x.id!==id);
      houses.forEach(h=>{if(h.group_id===id)h.group_id=null;});
      renderGroups(); renderList();
    })
    .subscribe();
}

// ═══════════════════════════════════════
// INIT — chargement depuis Supabase
// ═══════════════════════════════════════
async function init(){
  setSyncState('loading');
  document.getElementById('tbCount').textContent='Chargement…';

  try {
    // Charger groupes en premier (les maisons y font référence)
    const {data:gData, error:gErr} = await sb.from('groups').select('*').order('created_at');
    if(gErr) throw gErr;
    groups = gData || [];

    // Charger maisons
    const {data:hData, error:hErr} = await sb.from('houses').select('*').order('created_at');
    if(hErr) throw hErr;
    houses = hData || [];

    // Placer les marqueurs sur la carte
    houses.forEach(h => addM(h));

    renderList(); renderGroups(); updateFilter(); renderCPicker();
    setSyncState('ok');

    // Activer la sync temps réel
    setupRealtime();

  } catch(err) {
    console.error('Erreur init:', err);
    setSyncState('err');
    document.getElementById('tbCount').textContent='Erreur connexion';
    showToast('⚠️ Impossible de se connecter à la base de données', 4000);
  }
}

init();
</script>
